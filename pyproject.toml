[project]
name = "vayudrishti"
version = "0.1.0"
description = "VayuDrishti (वायुदृष्टि) — Hourly PM2.5 Forecasting & 3D Atmospheric Digital Twin for the 2026 Google Mumbai Air Quality Data Challenge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "chronos-forecasting>=2.3.2",
    "folium>=0.20.0",
    "google-genai>=1.51.0",
    "huggingface-hub>=0.34.0,<2",
    "litellm>=1.108.2",
    "jupyter>=1.1.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "optuna>=5.0.0",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "shap>=0.54.1",
    "streamlit>=1.67.0",
    "streamlit-folium>=0.27.4",
    "tabpfn>=9.2.0",
    "timesfm[torch]==3.0.2",
    "torch>=2.15.0",
    "xgboost>=3.4.1",
    "zindi>=0.0.4",
]
